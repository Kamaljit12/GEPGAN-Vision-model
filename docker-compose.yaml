services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photo-repair-api
    restart: unless-stopped
    # Pass through NVIDIA GPU (requires NVIDIA driver + Container Toolkit / Docker Desktop WSL2 GPU)
    gpus: all
    volumes:
      # Persist downloaded GFPGAN / detection weights across restarts
      - photo-repair-weights:/app/gfpgan/weights
      - photo-repair-models:/app/experiments/pretrained_models
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # Optional: expose API directly (also reachable via nginx at /api/)
    # ports:
    #   - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: photo-repair-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_started

volumes:
  photo-repair-weights:
  photo-repair-models:
